name: NIST SP 800-22

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'v1 or v02'
        required: true
        default: 'v02'
        type: choice
        options: [v1, v02]

jobs:
  nist:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install pexpect
        run: pip install pexpect

      - name: Download NIST STS 2.1.2
        run: |
          curl -L -o sts.zip https://csrc.nist.gov/CSRC/media/Projects/Random-Bit-Generation/documents/sts-2_1_2.zip
          unzip -q sts.zip
          mv sts-2.1.2/sts-2.1.2 ./sts-2.1.2 || mv sts-2.1.2 ./sts-2.1.2
          cd sts-2.1.2
          make -j4

      - name: Generate input (v0.1 or v0.2)
        run: |
          if [ "${{ github.event.inputs.version }}" = "v02" ]; then
            export MYSX_ROT_CAL="22,5,8,7,17,10,30,1,11,26,6,3,12,23,25,13,28,20,21,19,24,2,18,9,4,15,29,27,16,14,31"
          fi
          MYSX_ENABLE_TEST=1 node misc/gen_nist_input.js

      - name: Run NIST (automated via pexpect)
        run: python3 tests/run_nist.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nist-report-${{ github.event.inputs.version }}
          path: sts-2.1.2/experiments/AlgorithmTesting/finalAnalysisReport.txt
          retention-days: 30
